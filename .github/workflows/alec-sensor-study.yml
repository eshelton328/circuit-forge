name: ALEC Sensor prototype checks
on:
  pull_request:
    paths:
      - 'boards/alec-sensor/**'
      - 'boards/esp32s3-devkit-5v/**'
      - 'enclosures/alec-sensor/**'
      - 'tests/test_alec_sensor.py'
      - '.github/workflows/alec-sensor-study.yml'
      - 'libs/**'
  push:
    branches: [main]
    paths:
      - 'boards/alec-sensor/**'
      - 'boards/esp32s3-devkit-5v/**'
      - 'enclosures/alec-sensor/**'
      - '.github/workflows/alec-sensor-study.yml'
      - 'libs/**'
permissions:
  contents: read
jobs:
  sensor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Export fresh connectivity and check routed layout intent
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/workspace/.kicad-ci-home \
            -v "$GITHUB_WORKSPACE:/workspace" -w /workspace \
            kicad/kicad:10.0@sha256:feb600e931ca7ad8ae684566131edbea32218cb90ab54bb2ea0944cee257eea6 \
            bash -euc '
              source scripts/ci/setup-kicad-env.sh
              d=boards/alec-sensor
              kicad-cli sch erc --exit-code-violations --format json -o "$d/review/erc.json" "$d/alec-sensor.kicad_sch"
              kicad-cli sch export netlist --format kicadxml -o "$d/review/netlist.xml" "$d/alec-sensor.kicad_sch"
              kicad-cli pcb drc --exit-code-violations --refill-zones --save-board --schematic-parity --format json -o "$d/review/drc.json" "$d/alec-sensor.kicad_pcb"
              python3 "$d/tools/check_design.py"
              python3 "$d/tools/check_layout.py"
              python3 "$d/tools/audit_models.py"
              python3 scripts/ci/check_copper_connectivity.py "$d" > "$d/review/copper-connectivity.txt"
              python3 "$d/tools/power_budget.py"
            '
      - name: Run passive input SPICE and power sensitivity screens
        run: |
          sudo apt-get update
          sudo apt-get install -y ngspice
          python3 boards/alec-sensor/tools/power_screening.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: alec-sensor-electrical-screening
          path: |
            boards/alec-sensor/review/*.json
            boards/alec-sensor/review/netlist.xml
            boards/alec-sensor/review/copper-connectivity.txt
            boards/alec-sensor/review/power-screening/
  mechanical:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Rebuild nominal enclosure solids and check explicit intersections
        run: |
          python -m pip install cadquery==2.8.0
          python enclosures/alec-sensor/tools/build_cad.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: alec-sensor-nominal-cad
          path: |
            enclosures/alec-sensor/cad-checks.json
            enclosures/alec-sensor/cad-parts.json
            enclosures/alec-sensor/alec-sensor-s1-mechanical.step
